<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pinned Message | ForestMind</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --color-forest: #2c4c2c;
            --color-leaf: #4a6c4a;
            --color-clay: #8a9a8a;
            --color-bg: #fdfdfd;
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: var(--color-bg);
            color: var(--color-forest);
            font-family: var(--font-main);
            margin: 0;
            padding: 30px;
            line-height: 1.6;
            display: flex;
            justify-content: center;
        }

        #content {
            max-width: 600px;
            width: 100%;
            animation: fadeIn 0.4s ease-out;
        }
        .header {
            font-size: 10px;
            color: #bbb;
            margin-bottom: 40px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">Pinned from ForestMind</div>
    <div id="content"></div>

    <script>
        // This runs instantly when Electron loads the file
        const savedHtml = localStorage.getItem('pinnedMessageHtml');
        if (savedHtml) {
            document.getElementById('content').innerHTML = savedHtml;
        }
    </script>
</body>
</html>
